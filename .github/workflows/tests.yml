name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"             # davigen's runtime (the project template needs its zstd)
      - run: pip install pytest pyflakes -r requirements.txt
      - run: pyflakes davigen tests scripts
      - run: python -m pytest -q
      - run: zsh -n install.sh && zsh -n uninstall.sh
