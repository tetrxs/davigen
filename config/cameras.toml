# Known cameras. `match` is compared (case-insensitive, regex) against the model string
# found in the clip metadata. Unknown cameras still work: davigen derives a name from
# make + model and lets you pick the profile in the app.
#
# key       -> used in bin/group names (G_<key>_<PROFILE>)
# profiles  -> log profiles this camera can record (first = default guess)

[brands]
panasonic = ["panasonic"]
sony = ["sony"]
canon = ["canon"]
nikon = ["nikon"]
fujifilm = ["fujifilm", "fuji"]
dji = ["dji"]
apple = ["apple"]
blackmagic = ["blackmagic"]
insta360 = ["insta360", "arashi"]
gopro = ["gopro"]
leica = ["leica"]
arri = ["arri"]
samsung = ["samsung"]
xiaomi = ["xiaomi"]
red = ["red digital", "red "]

[[camera]]
key = "LUMIX_S1II"
name = "Panasonic LUMIX S1II"
brand = "panasonic"
match = "DC-S1M2$|S1II|S1 ?II$"
profiles = ["VLOG", "HLG", "REC709"]

[[camera]]
key = "LUMIX_S1IIE"
name = "Panasonic LUMIX S1IIE"
brand = "panasonic"
match = "DC-S1M2ES|S1IIE"
