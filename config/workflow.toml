# davigen – the standard every new project gets.
# Everything here is a default; the app lets you change format, frame rate and exports per project.

[project]
fps = 25
aspect = "3:2"                    # master aspect ratio (see [[aspect]] below)
transfer = "move"                 # move | copy | leave  – how footage gets into the project folder
default_root = "~/Movies/davigen" # where new project folders are created
fps_choices = [23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60]
# Resolve (free version) renders timelines up to UHD: long side <= 3840, short side <= 2160
free_max = [3840, 2160]

[project.settings]
# Project.SetSetting keys/values verified against Resolve 21
colorScienceMode = "davinciYRGB"
colorSpaceTimeline = "DaVinci WG/Intermediate"
colorSpaceOutput = "Rec.709 Gamma 2.4"
timelineInputResMismatchBehavior = "scaleToCrop"
# proxy mode first – setting it resets the proxy resolution
perfProxyMediaMode = "1"
perfProxyResolutionRatio = "half"
perfRenderCacheMode = "smart"

# Master formats. The first preset that fits the Resolve edition is the default,
# unless the footage suggests something else.
[[aspect]]
id = "3:2"
label = "3:2 · open gate / full sensor"
presets = [[5952, 3968], [4320, 2880], [3240, 2160]]

[[aspect]]
id = "16:9"
label = "16:9 · widescreen"
presets = [[7680, 4320], [5760, 3240], [3840, 2160], [2560, 1440], [1920, 1080]]

[[aspect]]
id = "17:9"
label = "17:9 · DCI"
presets = [[4096, 2160], [2048, 1080]]

[[aspect]]
id = "4:3"
label = "4:3 · open gate (MFT) / anamorphic"
presets = [[5760, 4320], [2880, 2160], [1440, 1080]]

[[aspect]]
id = "2.39:1"
label = "2.39:1 · cinemascope"
presets = [[3840, 1608], [1920, 804]]

[[aspect]]
id = "9:16"
label = "9:16 · vertical"
presets = [[2160, 3840], [1080, 1920]]

[[aspect]]
id = "4:5"
label = "4:5 · portrait feed"
presets = [[2160, 2700], [1080, 1350]]

[[aspect]]
id = "1:1"
label = "1:1 · square"
presets = [[2160, 2160], [1080, 1080]]

# Physical folder tree on disk (relative to the project folder). Export folders are added per delivery.
[folders]
tree = [
  "00_ADMIN/PROJECT_INFO", "00_ADMIN/VERSION_HISTORY", "00_ADMIN/REFERENCES",
  "01_MEDIA/90_AUDIO", "01_MEDIA/91_STILLS", "01_MEDIA/92_STOCK",
  "02_RESOLVE/01_PROJECT_FILES", "02_RESOLVE/02_BACKUPS", "02_RESOLVE/03_GALLERY",
  "03_WORK/PROXIES", "03_WORK/CACHE", "03_WORK/OPTIMIZED_MEDIA",
  "04_ASSETS/MUSIC", "04_ASSETS/SFX", "04_ASSETS/GRAPHICS", "04_ASSETS/LOGOS",
  "04_ASSETS/FONTS", "04_ASSETS/LUTS", "04_ASSETS/VFX",
  "05_EXPORTS/01_DRAFTS", "05_EXPORTS/02_REVIEW",
  "99_ARCHIVE",
]
# Camera media folders are added per camera: 01_MEDIA/01_<CAMERA>, 02_<CAMERA> … (90+ reserved)
media_root = "01_MEDIA"
gallery = "02_RESOLVE/03_GALLERY"

# Media Pool bins. Camera bins are added under 01_FOOTAGE automatically.
[bins]
tree = [
  "00_ADMIN/PROJECT_INFO", "00_ADMIN/REFERENCES", "00_ADMIN/VERSIONS",
  "01_FOOTAGE",
  "02_SELECTS/01_A_ROLL", "02_SELECTS/02_B_ROLL", "02_SELECTS/03_DRONE",
  "02_SELECTS/04_FAVORITES", "02_SELECTS/05_FINAL_SELECTS",
  "03_TIMELINES/01_ASSEMBLY", "03_TIMELINES/02_EDIT", "03_TIMELINES/03_MASTER",
  "03_TIMELINES/04_DELIVERABLES",
  "04_AUDIO/MUSIC", "04_AUDIO/VO", "04_AUDIO/DIALOGUE", "04_AUDIO/SFX", "04_AUDIO/AMBIENCE",
  "05_GRAPHICS/TITLES", "05_GRAPHICS/LOWER_THIRDS", "05_GRAPHICS/LOGOS", "05_GRAPHICS/VFX",
  "06_EXPORTS",
  "07_POWERGRADES",
  "08_REFERENCES",
]
footage = "01_FOOTAGE"

# Working timelines in master resolution. {aspect} and {fps} are filled in, e.g. TL_01_ASSEMBLY_3X2_25_v001.
[[timelines]]
role = "assembly"
name = "TL_01_ASSEMBLY_{aspect}_{fps}_v001"
bin = "03_TIMELINES/01_ASSEMBLY"
fill_with_footage = true

[[timelines]]
role = "edit"
name = "TL_02_EDIT_{aspect}_{fps}_v001"
bin = "03_TIMELINES/02_EDIT"

[[timelines]]
role = "master"
name = "TL_03_MASTER_{aspect}_{fps}_v001"
bin = "03_TIMELINES/03_MASTER"

[tracks]
video = ["MAIN", "SECONDARY", "BROLL", "ADJUSTMENT", "TITLES"]
audio = ["PRODUCTION", "DIALOGUE_VO", "MUSIC", "SFX", "AMBIENCE", "CAMERA_SCRATCH"]

[color]
output_profile = "REC709_G24"

# Deliveries. "master" renders the master timeline; every other entry gets its own timeline
# (TL_04_DELIVERY_16X9_25_v001 …) at its resolution, reframed from the master.
[[deliver]]
id = "master"
label = "Master · project resolution · ProRes 422 HQ"
resolution = "master"
format = "mov"
codec = "ProRes422HQ"
folder = "05_EXPORTS/05_MASTER"
filename = "{project}_MASTER_{aspect}_v001"
default = true

[[deliver]]
id = "16x9_uhd"
label = "16:9 UHD · YouTube · H.265"
resolution = [3840, 2160]
format = "mp4"
codec = "H265"
folder = "05_EXPORTS/03_16X9"
filename = "{project}_WEB_16X9_4K_v001"
default = true

[[deliver]]
id = "9x16_1080"
label = "9:16 1080×1920 · Reels / Shorts / TikTok · H.264"
resolution = [1080, 1920]
format = "mp4"
codec = "H264"
folder = "05_EXPORTS/04_9X16"
filename = "{project}_SOCIAL_9X16_1080_v001"
default = true

[[deliver]]
id = "16x9_hd"
label = "16:9 HD · H.264"
resolution = [1920, 1080]
format = "mp4"
codec = "H264"
folder = "05_EXPORTS/03_16X9"
filename = "{project}_WEB_16X9_HD_v001"
default = false

[[deliver]]
id = "4x5_1080"
label = "4:5 1080×1350 · Instagram feed · H.264"
resolution = [1080, 1350]
format = "mp4"
codec = "H264"
folder = "05_EXPORTS/06_4X5"
filename = "{project}_SOCIAL_4X5_1080_v001"
default = false

[[deliver]]
id = "1x1_1080"
label = "1:1 1080×1080 · square · H.264"
resolution = [1080, 1080]
format = "mp4"
codec = "H264"
folder = "05_EXPORTS/07_1X1"
filename = "{project}_SOCIAL_1X1_1080_v001"
default = false

# Basic Correction (docs/concepts/BASIC_CORRECTION.md). Every threshold lives here, not in the code;
# the values are first guesses until the evaluation (plan step 09) tunes them on hand-graded clips.
# Stops are relative to 18 % grey, fractions are of the frame, angles in degrees. Flag thresholds were set on
# 57 real clips (Lumix V-Log + DJI D-Log M, 2026-09-28) so that they flag the unusual, not every hand-held shot.
[basic_correction]
wizard_default = true              # the New project wizard's 'Basic correction' checkbox starts ticked
samples = { min = 5, per_seconds = 4, max = 12 }
analysis_width = 480
confidence_flag_below = 0.6

[basic_correction.measure]
centre_sigma = 0.35                 # soft centre weighting: Gaussian sigma in fractions of frame width and height
black_stops = 5.0                   # darker than grey − 5 stops counts as near black
clip_tolerance = 0.002              # DaVinci Intermediate distance to the clip's maximum that still counts as clipped
clip_min_fraction = 0.003           # a maximum only counts as a clip level if this much of the clip sits on it
midtone_stops = 2.5                 # white balance uses pixels within ± this of the frame's key
skin = { hue = [110, 136], chroma = [0.03, 0.22], luma = [0.15, 0.90], min_fraction = 0.02, flag_fraction = 0.05, line = 123, max_off = 8 }
high_key = { min_stops = 0.7, max_shadow_fraction = 0.05, max_chroma = 15 }
low_key = { min_black_fraction = 0.35, min_bright_fraction = 0.08 }
white_balance = { minkowski_p = 6, edge_p = 6, achromatic_top = 0.1, achromatic_max_angle = 3.0, iterations = 3, learned = true }
dominant_hue = { bin = 30, min_chroma = 0.04 }
haze = { max_range_stops = 5.0, max_local_contrast = 0.012 }

[basic_correction.flags]
clipped = 0.03                      # "clipped highlights"
wb_spread = 12.0                    # "no neutral surfaces": classic estimators disagree by more than this …
wb_disagree_learned = 8.0           # … or, with the learned model, it and the classic median by more than this …
achromatic_min = 0.01               # … or fewer achromatic pixels than this
dominant = 0.5                      # "dominant colour"
mixed_light = 14.0                  # "mixed light": halves of the frame disagree by more than this
exposure_spread = 3.3               # "changes within clip", in stops (hand-held walks and pans vary a lot) …
mired_spread = 150                  # … or in mired (10⁶/K; 150 ≈ 4000 → 10000 K, i.e. sun to shade and sky)
night_ev = 5.0                      # EV100 below this is night

# Corrections per node (plan step 05). Stops relative to 18 % grey, display values 0–1.
[basic_correction.exposure]
max_stops_down = 3.0                # log exposed to the right comes down a long way ("limit reached" beyond) …
max_stops_up = 1.5                  # … lifting underexposed footage lifts its noise
clipped_white = 0.9                 # darkening stops where the camera's clip level would drop below this display value
skin_ire = [60, 70]                 # skin after the output LUT, when at least skin.min_fraction of the frame is skin
skin_max_nudge = 0.5                # skin may move the key-based exposure by this much, no more
skin_disagree = 1.0                 # skin wanted more than this: lower confidence
ev_full = 10.0                      # EV100 at or above: daylight, key goes to grey
ev_low = 5.0                        # EV100 at ev_low: key goes to ev_low_target; below: night
ev_low_target = -1.0
night_target = -1.5                 # night is only brightened when it sits more than night_margin below this
night_margin = 0.5
high_key_max = 2.0                  # a high-key frame may stay this bright
low_key_min = -2.5                  # a low-key frame may stay this dark

[basic_correction.white_balance]
# [from kelvin, strength]: the first row whose kelvin the measured CCT reaches. Warm and cool light is often the
# point of a shot, so it is only partly neutralised; green/magenta (Duv) is always corrected fully.
cct_strength = [[7500, 0.6], [5000, 1.0], [3500, 0.6], [0, 0.35]]
max_duv = 0.02                      # larger green/magenta casts are corrected this far and flagged
neutral_cct = 6504                  # D65, the white of Rec.709

[basic_correction.contrast]
range = [0.85, 1.35]
black = [0.02, 0.04]                # 0.5th percentile of display luma
white_max = 0.95                    # 99.5th percentile of the pixels the camera didn't clip …
white_ceiling = 0.98                # … or up to this, if they were above white_max already
haze_factor = 0.5                   # flat, hazy scenes get only this share of the change

[basic_correction.saturation]
range = [0.85, 1.25]
chroma = [12, 26]                   # target mean CIELAB C* of the display image

[basic_correction.confidence]
# what each finding takes off a node's confidence (1 = sure)
clipped = 0.3
changes = 0.3
key = 0.3
night = 0.2
limit = 0.2
skin_disagree = 0.2
wb_spread_free = 6.0                # estimator disagreement that is normal on real scenes …
wb_spread_per_degree = 0.06         # … and what each degree beyond it costs
wb_disagree_free = 2.0              # the same with the learned model: learned vs classic up to this is normal …
wb_disagree_per_degree = 0.08       # … each degree beyond costs this (median error 0.8° below 2°, 4° above 8°)
achromatic = 0.4
dominant = 0.4
mixed_light = 0.3
haze = 0.3

[basic_correction.scenes]
gap_minutes = 10                    # a longer pause between recordings starts a new scene
split_ev = 3.0                      # … so does a jump in EV100 …
split_cct = 1500                    # … or in illuminant CCT between neighbours with good white balance
pull_to_scene = 0.3                 # confident clips move this far towards the scene's reference
pull_fixed_wb = 0.7                 # with the same manual Kelvin on every shot, white balance leans this far on the scene

# Learning from your grades (concept §13): 'Compare with my grade' → 'Learn from it' moves the targets towards your
# own versions. What was learned is stored per user in data/basic_learned.json; delete that file to forget it.
[basic_correction.learning]
rate = 0.5                          # share of the median difference taken over per comparison
max_exposure = 1.0                  # the learned offsets never go beyond these
max_kelvin = 1500
max_black = 0.03
chroma = [0.7, 1.4]

# Edit Assist (docs/concepts/EDIT_ASSIST.md): selects, beat markers, rough cut to music.
[edit_assist.selects]
sharp_rel = [0.35, 0.75]            # sharpness relative to the shot around it: unusable … fully good
sharp_window = 5.0                  # seconds either side that "the shot around it" means
blur_abs = 0.01                     # below this absolute sharpness a frame is blurred whatever the clip
shake = [0.08, 0.35]                # jitter in frame widths per second: fine … bad
pan_speed = [0.6, 1.4]              # camera motion in frame widths per second: fine … whip pan
dark = 0.04                         # mean luma below this: dark / covered
no_detail = 0.002                   # mean gradient below this: nothing in frame
unusable_below = 0.2
unusable_min = 1.0                  # seconds
good_above = 0.6
good_min = 2.0
voice_above = 0.5
speech_min = 1.5

[edit_assist.selects_timeline]
max_seconds = 6.0                   # at most this much of each good stretch (from its calmest part)
min_rating = 0.5

[edit_assist.rough_cut]
bars_calm = 2                       # shot length in bars where the music is calm …
bars_energetic = 1                  # … and where it is energetic
energy_split = 0.55                 # section energy (0–1) from which a section counts as energetic
half_bar_above_bpm = 0              # cut every half bar above this tempo (0 = never)
max_per_clip = 3                    # shots from one clip at most
min_gap = 4.0                       # seconds between two shots from the same clip
skip_speech = true                  # stretches with speech would fight the music
