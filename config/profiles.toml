# Log/colour profiles and where davigen gets the transform to DaVinci Wide Gamut / Intermediate.
#
# Every profile lists up to three sources; davigen uses the first that works on this machine:
#   1. cst    – Resolve's own Color Space Transform (color_space + gamma enums). Only used when the
#               installed Resolve offers both enums (read from Resolve itself, so updates count).
#   2. math   – the published log formula via colour-science (math_curve + math_gamut), exact.
#               math_curve may be a colour-science name or "logbase:<N>".
#   3. vendor – the manufacturer's official LUT, found in the manufacturer's download catalog
#               (davigen/providers/<vendor>.py). Needs "online sources" enabled.
# display-referred profiles (HLG, Rec.709) use tone_mapping = "default" so the output round-trips.

[working]
color_space = "DWG_COLORSPACE"
gamma = "DAV_INTER_OETF_GAMMA"

[outputs.REC709_G24]
label = "Rec.709 Gamma 2.4"
color_space = "REC709_COLORSPACE"
gamma = "TWOPOINTFOUR_GAMMA"
tone_mapping = "default"   # DaVinci tone mapping

# ------------------------------------------------------------------ Panasonic / Leica
[profiles.VLOG]
label = "Panasonic V-Log / V-Gamut"
short = "VLOG"
color_space = "VLOG_COLORSPACE"
gamma = "PANASONIC_VLOG_GAMMA"
math_curve = "V-Log"
math_gamut = "V-Gamut"
brands = ["panasonic"]
hints = ["v-log", "vlog"]

[profiles.LLOG]
label = "Leica L-Log / Rec.2020"
short = "LLOG"
